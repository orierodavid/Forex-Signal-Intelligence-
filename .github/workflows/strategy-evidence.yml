name: Strategy Evidence Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_strategy_evidence.py'
      - 'src/forex_intelligence/strategy_evidence.py'
      - 'src/forex_intelligence/market_data/**'
      - '.github/workflows/strategy-evidence.yml'
      - 'pyproject.toml'

jobs:
  strategy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run strategy evidence matrix
        env:
          MARKET_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONPATH: src
        run: python scripts/run_strategy_evidence.py
