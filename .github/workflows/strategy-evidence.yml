name: Strategy Evidence Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run_strategy_evidence.py'
      - 'src/forex_intelligence/strategy_evidence.py'
      - 'src/forex_intelligence/market_data/**'
      - '.github/workflows/strategy-evidence.yml'

jobs:
  strategy-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run strategy evidence matrix
        env:
          MARKET_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/run_strategy_evidence.py
