name: Scheduled Forex Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

# Prevent overlapping scheduled runs from reading/writing the same quota cache.
concurrency:
  group: scheduled-forex-signal
  cancel-in-progress: false

jobs:
  signal:
    # Cloud-only runner: no local Windows machine or MT5 terminal required.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FOREX_SYMBOLS: ${{ vars.FOREX_SYMBOLS || 'EURUSD,GBPUSD,USDJPY,EURJPY,XAUUSD' }}
      SIGNAL_EQUITY: ${{ vars.SIGNAL_EQUITY || '1000' }}
      TICK_SIZE: ${{ vars.TICK_SIZE || '0.00001' }}
      TICK_VALUE: ${{ vars.TICK_VALUE || '1' }}
      VOLUME_STEP: ${{ vars.VOLUME_STEP || '0.01' }}
      MIN_VOLUME: ${{ vars.MIN_VOLUME || '0.01' }}
      MAX_VOLUME: ${{ vars.MAX_VOLUME || '100' }}
      TRIGGER_CONFIRMED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Twelve Data cache
        uses: actions/cache@v4
        with:
          path: .cache/twelvedata
          key: twelvedata-snapshots-${{ github.run_id }}
          restore-keys: |
            twelvedata-snapshots-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Run tests
        shell: bash
        run: python -m pytest

      - name: Run scheduled analysis
        shell: bash
        run: python scripts/run_scheduled_signal.py
