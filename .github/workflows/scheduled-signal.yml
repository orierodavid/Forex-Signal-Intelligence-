name: Scheduled Forex Signal

on:
  workflow_dispatch:
  schedule:
    # 10-minute polling during the actual Lagos trading/data window.
    # Offset from minute 00 to reduce GitHub scheduled-event congestion.
    # 09:07-19:57 UTC = 10:07-20:57 Africa/Lagos, Monday-Friday.
    # 66 runs/day maximum (~1,980 runs per 30-day month), staying within
    # the 2,000 GitHub Actions/month budget while still polling every 10 min.
    - cron: "7,17,27,37,47,57 9-19 * * 1-5"

permissions:
  contents: read

concurrency:
  group: scheduled-forex-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FOREX_SYMBOLS: "EURUSD,USDCHF,AUDUSD,USDCAD,NZDUSD,XAUUSD"
      SIGNAL_EQUITY: ${{ vars.SIGNAL_EQUITY || '1000' }}
      TICK_SIZE: ${{ vars.TICK_SIZE || '0.00001' }}
      TICK_VALUE: ${{ vars.TICK_VALUE || '1' }}
      VOLUME_STEP: ${{ vars.VOLUME_STEP || '0.01' }}
      MIN_VOLUME: ${{ vars.MIN_VOLUME || '0.01' }}
      MAX_VOLUME: ${{ vars.MAX_VOLUME || '100' }}
      TRIGGER_CONFIRMED: "false"
      SCHEDULER_STATE_PATH: .cache/scheduler_state.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore scheduler state and Twelve Data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: scheduled-forex-state-${{ github.run_id }}
          restore-keys: |
            scheduled-forex-state-
            twelvedata-snapshots-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install "."

      - name: Run scheduled analysis
        shell: bash
        run: python scripts/run_scheduled_signal.py
