name: Scheduled Forex Signal

on:
  workflow_dispatch:
  schedule:
    # Every 20 minutes during the Lagos trading/data window.
    # 30 runs/day maximum, leaving substantial Twelve Data and GitHub Actions headroom.
    - cron: "7,27,47 9-18 * * 1-5"

permissions:
  contents: read

concurrency:
  group: scheduled-forex-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FOREX_SYMBOLS: "EURUSD,USDCHF,AUDUSD,USDCAD,NZDUSD,XAUUSD"
      SIGNAL_EQUITY: ${{ vars.SIGNAL_EQUITY || '1000' }}
      TICK_SIZE: ${{ vars.TICK_SIZE || '0.00001' }}
      TICK_VALUE: ${{ vars.TICK_VALUE || '1' }}
      VOLUME_STEP: ${{ vars.VOLUME_STEP || '0.01' }}
      MIN_VOLUME: ${{ vars.MIN_VOLUME || '0.01' }}
      MAX_VOLUME: ${{ vars.MAX_VOLUME || '100' }}
      TRIGGER_CONFIRMED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install "."

      - name: Run scheduled analysis
        shell: bash
        run: python scripts/run_scheduled_signal.py
