name: Conditional Walk-Forward Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_conditional_walk_forward_evidence.py'
      - 'src/forex_intelligence/strategy_evidence.py'
      - '.github/workflows/conditional-walk-forward-evidence.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run conditional walk-forward evidence
        env:
          MARKET_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_conditional_walk_forward_evidence.py | tee conditional_walk_forward_evidence.txt

      - name: Publish validated strategy profile
        run: |
          if [ ! -f strategy_profile.json ]; then
            echo "strategy_profile.json was not generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy_profile.json
          if git diff --cached --quiet; then
            echo "STRATEGY_PROFILE_UNCHANGED"
          else
            git commit -m "chore: publish validated strategy profile"
            git push origin HEAD:main
          fi

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-walk-forward-evidence
          path: conditional_walk_forward_evidence.txt
          if-no-files-found: ignore
