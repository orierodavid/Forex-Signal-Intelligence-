name: Conditional Walk-Forward Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/run_conditional_walk_forward_evidence.py'
      - 'src/forex_intelligence/strategy_evidence.py'
      - '.github/workflows/conditional-walk-forward-evidence.yml'

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run conditional walk-forward evidence
        env:
          MARKET_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_conditional_walk_forward_evidence.py | tee conditional_walk_forward_evidence.txt

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-walk-forward-evidence
          path: conditional_walk_forward_evidence.txt
          if-no-files-found: ignore
