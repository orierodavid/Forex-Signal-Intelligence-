name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run tests
        run: pytest

      - name: Verify execution safety defaults
        run: |
          python - <<'PY'
          from forex_intelligence.config import Settings

          settings = Settings()
          assert settings.execution_mode == "ANALYSIS_ONLY"
          assert settings.execution_enabled is False
          assert settings.live_execution_enabled is False
          print("Execution safety defaults verified: ANALYSIS_ONLY / execution disabled / live disabled")
          PY
