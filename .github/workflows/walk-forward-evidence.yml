name: Walk-forward evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Current vs adaptive evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Verify market-data credential is injected
        run: |
          test -n "$MARKET_DATA_API_KEY" || (echo "TWELVE_DATA_API_KEY secret was not injected" && exit 1)
      - name: Run walk-forward evidence
        run: python scripts/run_walk_forward_evidence.py
