name: Walk-forward evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Current vs adaptive evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Run walk-forward evidence
        run: python scripts/run_walk_forward_evidence.py
