[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-signal-intelligence"
version = "0.1.0"
description = "Production-oriented Forex market intelligence and controlled MT5 execution platform."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
market = ["pandas>=2.2,<3", "numpy>=1.26,<3"]
mt5 = ["MetaTrader5>=5.0.29"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
